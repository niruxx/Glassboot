# Glassboot: how an ISO is booted.
#
# gb_boot_iso PATH mounts ($gb_data)PATH as (loop), then:
#
#   Windows installer (sources/boot.wim)  -> wimboot + WinPE helper
#
#   Otherwise, depending on $gb_mode:
#     ""        Automatic (default). Enables the Glassboot hook, then runs the ISO's own
#               boot menu: grub.cfg, syslinux/isolinux config, loopback.cfg, or its EFI
#               loader, whichever exists first.
#     "loopback" Same, but loopback.cfg first (the distribution locates the ISO file).
#     "compat"  Phase-0 methods: known kernel/initrd layouts plus kernel arguments that
#               tell the distribution where the ISO file is. No hook.
#
# The hook (boot/grub-module/glassboot.c + hook/glassboot-hook.c) appends a small initrd
# to every kernel the ISO's menu starts. That initrd maps the ISO file as a block device,
# so the distribution finds its media without knowing anything about Glassboot.

function gb_pause {
  echo
  echo $"Press Enter to return to the menu."
  read
}

# ---------------------------------------------------------------- Windows
# Files in \glassboot\inject\windows\ are injected into WinPE's X:\Windows\System32.
# gb_inj_win is set inside the functions: the Windows options menu runs through
# `configfile`, which starts a new context that only sees exported variables.

# UEFI wimboot binary, boot loader name for this CPU, and the injection folder.
function gb_set_wimboot {
  set gb_inj_win="($gb_data)/glassboot/inject/windows"
  if [ "$grub_cpu" = "x86_64" ]; then
    set gb_wb="$gb_res/wimboot" ; set gb_arch=bootx64.efi
  else
    set gb_wb="$gb_res/wimboot.i386.efi" ; set gb_arch=bootia32.efi
  fi
}

# BIOS: injected files as newc:NAME:PATH words (names must not contain spaces).
function gb_win_inject16 {
  set gb_inj_win="($gb_data)/glassboot/inject/windows"
  set gb_inj16=""
  for gb_f in $gb_inj_win/*; do
    if [ -f "$gb_f" ]; then
      regexp -s 1:gb_n '/([^/]*)$' "$gb_f"
      set gb_inj16="$gb_inj16 newc:$gb_n:$gb_f"
    fi
  done
}

# A standalone Windows PE image (.wim): boot it as-is. wimboot takes BCD and boot.sdi
# from inside the image. Only the user's injection files are added (no Glassboot helper).
function gb_boot_wim {
  if [ "$grub_cpu" = "arm64" ]; then
    echo $"Standalone Windows WIM boot is not supported on ARM64. Use ARM64 ISO media."
    gb_pause
    return
  fi
  gb_hook_disable
  echo $"Booting $1 via wimboot..."
  if [ "$grub_platform" = "pc" ]; then
    gb_win_inject16
    linux16 "$gb_res/wimboot"
    initrd16 "newc:boot.wim:($gb_data)$1" $gb_inj16
    boot
  else
    gb_set_wimboot
    gb_wimboot_efi --inject "$gb_inj_win" "$gb_wb" boot.wim "($gb_data)$1"
  fi
  gb_pause
}

function gb_try_windows {
  if [ ! -f (loop)/sources/boot.wim ]; then return 1; fi
  if [ ! -f "$gb_res/wimboot" ]; then
    echo $"This is a Windows ISO, but wimboot is missing from the ESP."
    gb_pause
    return 0
  fi
  if [ -f (loop)/sources/install.wim -o -f (loop)/sources/install.esd -o -f (loop)/sources/install.swm ]; then
    # Windows installer: options menu (glassboot-windows.cfg) -> gb_boot_windows.
    configfile "$prefix/glassboot-windows.cfg"
  else
    # Windows PE tool disc (Hiren's, recovery/rescue media): no Setup. The helper mounts
    # the ISO and then runs the disc's own Windows PE startup.
    gb_boot_windows 0 0 "" tool
  fi
  return 0
}

# gb_boot_windows BYPASS LOCAL_ACCOUNT UNATTEND_PATH [MODE] (see glassboot-windows.cfg)
#   MODE: "setup" (default, Windows installers) or "tool" (Windows PE tool discs)
function gb_boot_windows {
  # Tell the WinPE helper (boot/win/glassboot.cmd) which ISO to attach and which options
  # to apply. Best effort: without grubenv it asks which ISO to use.
  set gb_iso="$iso_path"
  set gb_win_bypass="$1"
  set gb_win_local="$2"
  set gb_win_unattend="$3"
  set gb_win_mode="$4"
  if [ -z "$gb_win_mode" ]; then set gb_win_mode=setup; fi
  # Installers: our helper runs Setup. Tool discs: the disc's own startup runs, with our
  # helper mounting the ISO alongside it (boot/win/winpeshl-tool.ini).
  set gb_peshl="$gb_res/win/winpeshl.ini"
  if [ "$gb_win_mode" = "tool" ]; then set gb_peshl="$gb_res/win/winpeshl-tool.ini"; fi
  if [ -f "($gb_data)/glassboot/grubenv" ]; then
    save_env -f "($gb_data)/glassboot/grubenv" gb_iso gb_win_bypass gb_win_local gb_win_unattend gb_win_mode
  fi

  gb_hook_disable # wimboot must not get the Linux hook
  echo $"Booting Windows installer via wimboot..."
  if [ "$grub_platform" = "pc" ]; then
    gb_win_inject16
    linux16 "$gb_res/wimboot"
    initrd16 \
      newc:winpeshl.ini:$gb_peshl \
      newc:glassboot.cmd:$gb_res/win/glassboot.cmd \
      newc:glassboot-localacct.xml:$gb_res/win/glassboot-localacct.xml \
      newc:glassboot-attach.exe:$gb_res/win/glassboot-attach.exe \
      newc:glassboot-attach32.exe:$gb_res/win/glassboot-attach32.exe \
      newc:bcd:(loop)/boot/bcd \
      newc:boot.sdi:(loop)/boot/boot.sdi \
      newc:boot.wim:(loop)/sources/boot.wim \
      $gb_inj16
    boot
  else
    # UEFI: wimboot reads its files from a virtual file system the glassboot GRUB
    # module provides (see gb_wimboot_efi in boot/grub-module/glassboot.c).
    gb_set_wimboot
    set gb_archfile=""
    if [ -f "(loop)/efi/boot/$gb_arch" ]; then set gb_archfile="(loop)/efi/boot/$gb_arch"; fi
    if [ -n "$gb_archfile" ]; then
      gb_wimboot_efi --inject "$gb_inj_win" "$gb_wb" \
        winpeshl.ini "$gb_peshl" \
        glassboot.cmd "$gb_res/win/glassboot.cmd" \
        glassboot-localacct.xml "$gb_res/win/glassboot-localacct.xml" \
        glassboot-attach.exe "$gb_res/win/glassboot-attach.exe" \
        glassboot-attach32.exe "$gb_res/win/glassboot-attach32.exe" \
        "$gb_arch" "$gb_archfile" \
        BCD (loop)/efi/microsoft/boot/bcd \
        boot.sdi (loop)/boot/boot.sdi \
        boot.wim (loop)/sources/boot.wim
    else
      # No boot<arch>.efi on the ISO: wimboot extracts bootmgfw.efi from boot.wim.
      gb_wimboot_efi --inject "$gb_inj_win" "$gb_wb" \
        winpeshl.ini "$gb_peshl" \
        glassboot.cmd "$gb_res/win/glassboot.cmd" \
        glassboot-localacct.xml "$gb_res/win/glassboot-localacct.xml" \
        glassboot-attach.exe "$gb_res/win/glassboot-attach.exe" \
        glassboot-attach32.exe "$gb_res/win/glassboot-attach32.exe" \
        BCD (loop)/efi/microsoft/boot/bcd \
        boot.sdi (loop)/boot/boot.sdi \
        boot.wim (loop)/sources/boot.wim
    fi
  fi
  gb_pause
  return 0
}

# ---------------------------------------------------------------- ISO's own menu + hook
function gb_hook_on {
  if [ "$grub_cpu" = "arm64" ]; then
    set gb_hook_archive="$gb_res/glassboot-hook-arm64.cpio"
  else
    set gb_hook_archive="$gb_res/glassboot-hook-x86_64.cpio"
  fi
  if [ "$grub_cpu" = "x86_64" -o "$grub_cpu" = "arm64" -o "$grub_platform" = "pc" ]; then
    # The data device lets the module add \glassboot\inject\linux\* and <iso>.cpio.
    if ! gb_hook_enable "$iso_path" "$gb_partuuid" "$gb_hook_archive" "($gb_data)"; then return 1; fi
    # Alpine ships dm-mod in its modloop, outside the initrd. Bring that exact
    # kernel's module into the initrd so fragmented files work on every host FS.
    if [ -f (loop)/boot/modloop-lts ]; then
      insmod squash4
      if loopback gbmods (loop)/boot/modloop-lts; then
        set gb_modloop_active=1
        export gb_modloop_active
        for gb_tree in (gbmods)/modules/*; do
          regexp -s 1:gb_modver '/([^/]+)/?$' "$gb_tree"
          for gb_dm in "$gb_tree"/kernel/drivers/md/dm-mod.ko*; do
            if [ -f "$gb_dm" ]; then
              regexp -s 1:gb_modname '/([^/]+)$' "$gb_dm"
              if ! gb_hook_add_initrd "newc:usr/lib/modules/$gb_modver/kernel/drivers/md/$gb_modname:$gb_dm"; then return 1; fi
            fi
          done
        done
      fi
    fi
  fi
}

# Run the first boot configuration the ISO provides. Returns 1 if it has none.
#
# The ISO's GRUB menu is preferred over loopback.cfg: with the
# hook the distribution simply finds its media, whereas loopback.cfg makes it mount the
# exFAT partition itself, which fails when its initrd has no exFAT driver (Debian).
# gb_mode=loopback ("More boot modes") uses loopback.cfg first instead.
function gb_run_iso_menu {
  set root=(loop)
  if [ "$gb_mode" = "loopback" -a -f /boot/grub/loopback.cfg ]; then
    configfile /boot/grub/loopback.cfg
    return 0
  fi
  # Prefer EFI-specific menus on UEFI; BIOS keeps its existing menu order.
  set gb_menu_configs="/boot/grub/grub.cfg /boot/grub2/grub.cfg /EFI/BOOT/grub.cfg /efi/boot/grub.cfg /grub/grub.cfg"
  if [ "$grub_platform" = "efi" ]; then
    set gb_menu_configs="/EFI/BOOT/grub.cfg /efi/boot/grub.cfg /boot/grub/grub.cfg /boot/grub2/grub.cfg /grub/grub.cfg"
  fi
  for cfg in $gb_menu_configs; do
    if [ -f "$cfg" ]; then
      # Some grub.cfg files (Debian live-build) add findiso=${iso_path} for loop booting;
      # empty it so the distribution uses the device the hook provides instead.
      set iso_path=""
      configfile "$cfg"
      set iso_path="$gb_iso_path"
      return 0
    fi
  done
  if [ "$grub_platform" = "efi" -a "$gb_mode" != "isomenu" ]; then
    if [ -f /boot/grub/loopback.cfg ]; then
      configfile /boot/grub/loopback.cfg
      return 0
    fi
    # Do not silently select a BIOS-oriented syslinux menu on UEFI.
    gb_boot_vcd
    return 0
  fi
  for cfg in /isolinux/isolinux.cfg /boot/isolinux/isolinux.cfg /isolinux.cfg; do
    if [ -f "$cfg" ]; then
      regexp -s 1:gb_cwd '^(.*/)[^/]*$' "$cfg"
      syslinux_configfile -i --root=(loop) --cwd="$gb_cwd" "$cfg"
      return 0
    fi
  done
  for cfg in /boot/syslinux/syslinux.cfg /syslinux/syslinux.cfg /syslinux.cfg; do
    if [ -f "$cfg" ]; then
      regexp -s 1:gb_cwd '^(.*/)[^/]*$' "$cfg"
      syslinux_configfile -s --root=(loop) --cwd="$gb_cwd" "$cfg"
      return 0
    fi
  done
  if [ -f /boot/grub/loopback.cfg ]; then
    configfile /boot/grub/loopback.cfg
    return 0
  fi
  if [ "$grub_platform" = "efi" ]; then
    # No menu GRUB can read (BSDs, ESXi, other tools): boot the ISO's own EFI loader
    # (from its El Torito image) with the ISO presented as a virtual CD.
    gb_boot_vcd
    return 0
  fi
  return 1
}

# UEFI: present the ISO as a read-only virtual CD and start its EFI boot loader
# (gb_efi_vdisk_boot in boot/grub-module/glassboot.c).
function gb_boot_vcd {
  gb_hook_disable
  echo $"Starting the ISO's EFI boot loader with the ISO as a virtual CD..."
  gb_efi_vdisk_boot cd "($gb_data)$gb_iso_path"
  gb_pause
}

# FreeBSD GENERIC includes md(4): preloading the complete filesystem keeps root
# available after EFI/BIOS disk emulation disappears. Do not apply this to other BSDs.
# $1 = GRUB filesystem device, $2 = image file, $3 = FreeBSD mountfrom string.
function gb_boot_freebsd_ram {
  gb_hook_disable
  echo "Loading FreeBSD and its root filesystem into RAM..."
  if ! insmod bsd; then gb_pause; return; fi
  if ! kfreebsd "$1/boot/kernel/kernel"; then gb_pause; return; fi
  if [ -f "$1/boot/device.hints" ]; then
    kfreebsd_loadenv "$1/boot/device.hints"
  fi
  gb_freebsd_env
  set kFreeBSD.vfs.root.mountfrom="$3"
  set kFreeBSD.vfs.root.mountfrom.options=ro
  if ! kfreebsd_module "$2" type=md_image; then gb_pause; return; fi
  boot
  gb_pause
}

# .img (raw disk image) / .vhd (fixed-size).
#   UEFI: virtual disk + the image's EFI loader.
#   BIOS: memdisk loads the whole image into RAM and emulates a BIOS disk (images must
#         fit in memory below 4 GB; a fixed VHD's 512-byte footer is harmless).
# Windows installed inside a VHD/VHDX ("native VHD boot", Windows 10 1809 or later):
# Windows Boot Manager from the VHD's own Windows, started by wimboot with a BCD that
# points at the VHD file (gb_vhd_bcd patches our template, scripts/make-bcd.py). Windows
# then opens the VHD from the GLASSBOOT drive itself and keeps using it, read-write.
function gb_boot_vhd_windows {
  set gb_win="$gb_vdisk_windows"
  if [ "$gb_vdisk_windows_state" = "generalized" -o "$gb_vdisk_windows_state" = "failed" ]; then
    # Windows' first start ("specialize") updates the BCD store on the computer's system
    # partition, and when Glassboot starts it there is none, so that step fails.
    if [ "$gb_vdisk_windows_state" = "failed" ]; then
      echo $"The Windows in $1 failed to finish its first start."
    else
      echo $"The Windows in $1 has never been started (a freshly applied image)."
    fi
    echo
    echo $"Windows has to finish its first start once outside Glassboot: start the VHD"
    echo $"in a virtual machine (e.g. Hyper-V) or natively with bcdboot, until the first"
    echo $"setup screen (region/keyboard) or the desktop appears. After that, Glassboot"
    echo $"can start it."
    gb_vdisk
    gb_pause
    return
  fi
  echo $"Starting Windows from $1 (native VHD boot)..."
  if ! gb_vhd_bcd "$gb_res/win/bcd-vhd" "$1" "($gb_data)"; then
    gb_vdisk
    gb_pause
    return
  fi
  if [ "$grub_platform" = "pc" ]; then
    if [ ! -f "$gb_win/Windows/Boot/PCAT/bootmgr" ]; then
      echo $"This Windows has no BIOS boot manager (\\Windows\\Boot\\PCAT\\bootmgr)."
      gb_pause
      return
    fi
    linux16 "$gb_res/wimboot"
    initrd16 newc:bootmgr:$gb_win/Windows/Boot/PCAT/bootmgr newc:bcd:(proc)/glassboot_bcd
    boot
  else
    gb_set_wimboot
    if [ ! -f "$gb_win/Windows/Boot/EFI/bootmgfw.efi" ]; then
      echo $"This Windows has no UEFI boot manager (\\Windows\\Boot\\EFI\\bootmgfw.efi)."
      gb_pause
      return
    fi
    gb_wimboot_efi "$gb_wb" "$gb_arch" "$gb_win/Windows/Boot/EFI/bootmgfw.efi" BCD (proc)/glassboot_bcd
  fi
  gb_pause
}

# Disk images: .img (raw), .vhd (fixed or dynamic), .vhdx. gb_vdisk reads the format from
# the file and makes the disk inside available as (gbvd).
function gb_boot_img {
  set gb_img_path="$1"
  gb_hook_disable
  if ! gb_vdisk "($gb_data)$gb_img_path"; then
    gb_pause
    return
  fi
  if [ "$grub_cpu" = "arm64" ]; then
    gb_vdisk
    gb_efi_vdisk_boot hd "($gb_data)$gb_img_path"
    gb_pause
    return
  fi
  if [ -n "$gb_vdisk_windows" ]; then
    gb_boot_vhd_windows "$gb_img_path"
    return
  fi
  # Stock FreeBSD GPT memstick images. VHD containers need a decoded RAM image,
  # so only raw images are eligible for this preload path.
  if [ "$gb_vdisk_format" = "raw" ]; then
    for gb_p in 1 2 3 4 5 6 7 8; do
      if [ -f "(gbvd,gpt$gb_p)/boot/kernel/kernel" -a -f "(gbvd,gpt$gb_p)/boot/loader.conf" ]; then
        gb_boot_freebsd_ram "(gbvd,gpt$gb_p)" "($gb_data)$gb_img_path" "ufs:/dev/md0p$gb_p"
        gb_vdisk
        return
      fi
    done
    for gb_p in 1 2 3 4; do
      if [ -f "(gbvd,msdos$gb_p)/boot/kernel/kernel" -a -f "(gbvd,msdos$gb_p)/boot/loader.conf" ]; then
        gb_boot_freebsd_ram "(gbvd,msdos$gb_p)" "($gb_data)$gb_img_path" "ufs:/dev/md0s$gb_p"
        gb_vdisk
        return
      fi
      if [ -f "(gbvd,msdos$gb_p,bsd1)/boot/kernel/kernel" -a -f "(gbvd,msdos$gb_p,bsd1)/boot/loader.conf" ]; then
        gb_boot_freebsd_ram "(gbvd,msdos$gb_p,bsd1)" "($gb_data)$gb_img_path" "ufs:/dev/md0s${gb_p}a"
        gb_vdisk
        return
      fi
    done
  fi
  if [ "$grub_platform" = "pc" ]; then
    if [ "$gb_vdisk_format" != "raw" -a "$gb_vdisk_format" != "vhd-fixed" ]; then
      echo $"$gb_img_path is a $gb_vdisk_format image. On Legacy BIOS only raw images and"
      echo $"fixed-size VHDs can be booted (start the computer in UEFI mode instead)."
      gb_vdisk
      gb_pause
      return
    fi
    gb_vdisk
    echo $"Loading $gb_img_path into memory (memdisk)..."
    linux16 "$gb_res/memdisk" harddisk raw
    initrd16 "($gb_data)$gb_img_path"
    boot
  else
    gb_vdisk
    echo $"Starting the EFI boot loader on $gb_img_path ..."
    gb_efi_vdisk_boot hd "($gb_data)$gb_img_path"
  fi
  gb_pause
}

# BIOS: load the whole ISO into RAM and boot it as a CD (memdisk). For small ISOs whose
# OS doesn't need to find the ISO again after booting (DOS tools, firmware updaters).
function gb_boot_memdisk_iso {
  gb_hook_disable
  echo $"Loading $gb_iso_path into memory (memdisk)..."
  linux16 "$gb_res/memdisk" iso raw
  initrd16 "($gb_data)$gb_iso_path"
  boot
  gb_pause
}

function gb_boot_auto {
  if [ "$gb_mode" = "vcd" ]; then
    gb_boot_vcd
    return
  fi
  if [ "$gb_mode" = "memdisk" ]; then
    gb_boot_memdisk_iso
    return
  fi
  if ! gb_hook_on; then gb_pause; return; fi
  if ! gb_run_iso_menu; then
    gb_hook_disable
    echo $"This ISO has no boot menu Glassboot can use; trying compatibility mode."
    sleep 2
    gb_boot_compat
  fi
  # Back here if the user left the ISO's menu with Esc.
  gb_hook_disable
}

# ---------------------------------------------------------------- compatibility mode
# Boot (loop)$gb_k with initrd(s) $gb_i and cmdline $gb_args.
function gb_boot_linux {
  echo $"Kernel: $gb_k"
  echo $"Initrd: $gb_i"
  echo $"Args:   $gb_args"
  set root=(loop)
  linux $gb_k $gb_args
  initrd $gb_i
  boot
  gb_pause
}

function gb_try_loopback_cfg {
  if [ ! -f (loop)/boot/grub/loopback.cfg ]; then return 1; fi
  set root=(loop)
  configfile /boot/grub/loopback.cfg
  return 0
}

function gb_try_casper {
  if [ ! -d (loop)/casper ]; then return 1; fi
  set gb_k="" ; set gb_i=""
  for f in (loop)/casper/vmlinuz*; do
    if [ -z "$gb_k" -a -f "$f" ]; then regexp -s 1:gb_k '^\(loop\)(.*)$' "$f"; fi
  done
  for f in (loop)/casper/initrd*; do
    if [ -z "$gb_i" -a -f "$f" ]; then regexp -s 1:gb_i '^\(loop\)(.*)$' "$f"; fi
  done
  if [ -z "$gb_k" -o -z "$gb_i" ]; then return 1; fi
  set gb_args="boot=casper iso-scan/filename=$iso_path quiet splash ---"
  gb_boot_linux
  return 0
}

function gb_try_debian_live {
  if [ ! -d (loop)/live ]; then return 1; fi
  set gb_k="" ; set gb_i=""
  for f in (loop)/live/vmlinuz*; do
    if [ -z "$gb_k" -a -f "$f" ]; then regexp -s 1:gb_k '^\(loop\)(.*)$' "$f"; fi
  done
  for f in (loop)/live/initrd*; do
    if [ -z "$gb_i" -a -f "$f" ]; then regexp -s 1:gb_i '^\(loop\)(.*)$' "$f"; fi
  done
  if [ -z "$gb_k" -o -z "$gb_i" ]; then return 1; fi
  set gb_args="boot=live components findiso=$iso_path quiet splash"
  gb_boot_linux
  return 0
}

function gb_try_archiso {
  if [ ! -f (loop)/arch/boot/x86_64/vmlinuz-linux ]; then return 1; fi
  set gb_k=/arch/boot/x86_64/vmlinuz-linux
  set gb_i=""
  for f in /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img; do
    if [ -f "(loop)$f" ]; then set gb_i="$gb_i $f"; fi
  done
  set gb_i="$gb_i /arch/boot/x86_64/initramfs-linux.img"
  set gb_args="archisobasedir=arch img_dev=/dev/disk/by-uuid/$gb_data_uuid img_loop=$iso_path earlymodules=loop"
  gb_boot_linux
  return 0
}

function gb_try_dracut_live {
  set gb_k="" ; set gb_i=""
  if [ -f (loop)/images/pxeboot/vmlinuz ]; then
    set gb_k=/images/pxeboot/vmlinuz ; set gb_i=/images/pxeboot/initrd.img
  elif [ -f (loop)/boot/x86_64/loader/linux ]; then
    set gb_k=/boot/x86_64/loader/linux ; set gb_i=/boot/x86_64/loader/initrd
  else
    return 1
  fi
  probe -s gb_iso_label -l (loop)
  set gb_args="root=live:CDLABEL=$gb_iso_label iso-scan/filename=$iso_path rd.live.image quiet"
  gb_boot_linux
  return 0
}

function gb_boot_compat {
  gb_hook_disable
  if gb_try_loopback_cfg; then return; fi
  if gb_try_casper; then return; fi
  if gb_try_debian_live; then return; fi
  if gb_try_archiso; then return; fi
  if gb_try_dracut_live; then return; fi
  echo $"Compatibility mode doesn't recognise this ISO's layout."
  gb_pause
}

# ---------------------------------------------------------------- .efi applications
# UEFI tools copied to the drive as plain .efi files (memtest86+, UEFI shell, firmware
# updaters...). gb_scan only lists them when running on UEFI.
function gb_boot_efi {
  gb_hook_disable
  echo $"Starting $1 ..."
  chainloader "($gb_data)$1"
  boot
  gb_pause
}

# ---------------------------------------------------------------- entry points
# Every menu entry gb_scan generates calls: gb_entry iso|efi|img|wim PATH
function gb_entry {
  if [ "$gb_mode" = "checksum" ]; then
    gb_checksum "$2"
    return
  fi
  if [ "$1" = "iso" ]; then gb_boot_iso "$2"
  elif [ "$1" = "efi" ]; then gb_boot_efi "$2"
  elif [ "$1" = "img" ]; then gb_boot_img "$2"
  elif [ "$1" = "wim" ]; then gb_boot_wim "$2"
  fi
}

# Tools > Verify a file's checksum
function gb_checksum {
  echo $"Computing the $gb_hash_algo checksum of $1"
  echo $"(this reads the whole file and can take a few minutes)..."
  echo
  hashsum --hash "$gb_hash_algo" "($gb_data)$1"
  echo
  echo $"Compare it with the checksum published by the image's distributor."
  gb_pause
}

function gb_boot_iso {
  set iso_path="$1"
  set gb_iso_path="$1"
  export iso_path gb_iso_path
  # The nested modloop holds a reference to the ISO loop device. Release it
  # first when returning from one ISO menu and opening another.
  if [ "$gb_modloop_active" = "1" ]; then
    loopback -d gbmods
    set gb_modloop_active=""
    export gb_modloop_active
  fi
  loopback -d loop
  if ! loopback loop "($gb_data)$iso_path"; then
    echo $"Could not open $iso_path"
    gb_pause
    return
  fi

  # An explicit EFI-loader request must also apply to Windows and BSD ISOs.
  if [ "$gb_mode" = "vcd" ]; then
    gb_boot_vcd
    return
  fi
  # ARM Windows needs an ARM WinPE helper, which is not bundled yet. Let the
  # media's native EFI loader handle it rather than executing x86 wimboot.
  if [ "$grub_cpu" = "arm64" -a -f (loop)/sources/boot.wim ]; then
    gb_boot_vcd
    return
  fi
  if gb_try_windows; then return; fi
  # Keep explicit alternate modes available, including the original EFI loader.
  if [ "$grub_cpu" != "arm64" -a -z "$gb_mode" -a -f (loop)/boot/kernel/kernel -a -f (loop)/boot/loader.conf ]; then
    gb_boot_freebsd_ram "(loop)" "($gb_data)$iso_path" "cd9660:/dev/md0"
    return
  fi
  if [ "$gb_mode" = "compat" ]; then
    gb_boot_compat
  else
    gb_boot_auto
  fi
}
