# Glassboot: options shown after picking a Windows installer ISO.
# Loaded with `configfile` from gb_try_windows; $iso_path is the chosen ISO.
#
# gb_boot_windows BYPASS LOCAL_ACCOUNT UNATTEND_PATH
#   BYPASS         1 = skip Windows 11 TPM / Secure Boot / CPU / RAM / storage checks
#   LOCAL_ACCOUNT  1 = allow setting up Windows without a Microsoft account / internet
#   UNATTEND_PATH  answer file on the data partition (e.g. /glassboot/unattend/x.xml)

menuentry $"Windows Setup        $iso_path" --class windows {
  gb_boot_windows 0 0 ""
}
menuentry $"Windows Setup, skipping Windows 11 hardware checks (TPM, Secure Boot, CPU, RAM)" --class windows {
  gb_boot_windows 1 0 ""
}
menuentry $"Windows Setup, skipping hardware checks + allow a local account (no Microsoft account)" --class windows {
  gb_boot_windows 1 1 ""
}

# Unattended installs: every .xml in \glassboot\unattend\ on the GLASSBOOT drive.
function gb_add_unattend {
  menuentry $"Unattended install: $1" "$1" --class windows {
    gb_boot_windows 0 0 "$2"
  }
}
for gb_u in ($gb_data)/glassboot/unattend/*.xml; do
  if [ -f "$gb_u" ]; then
    regexp -s 1:gb_u_rel '^\([^)]*\)(.*)$' "$gb_u"
    gb_add_unattend "$gb_u_rel"
  fi
done
