# BIOS-USB boot menu
#
# Lives on the ESP (partition 2) at /boot/grub/grub.cfg. Scans the exFAT data
# partition (partition 1 of the same disk) for ISO files and builds a menu entry for
# each one. See boot/grub/biosusb-detect.cfg for how each ISO is booted.

set biosusb_version="0.1.0-dev"

insmod part_msdos
insmod fat
insmod exfat
insmod ntfs
insmod iso9660
insmod udf
insmod loopback
insmod regexp
insmod probe
insmod test
insmod echo
insmod sleep
insmod configfile
insmod linux
insmod all_video
if [ "$grub_platform" = "pc" ]; then
  insmod linux16
fi

set timeout=-1
set default=0

# ---------------------------------------------------------------------------
# Locate our partitions.
#   $prefix looks like (hd0,msdos2)/boot/grub  -> ESP = hd0,msdos2, disk = hd0
# ---------------------------------------------------------------------------
regexp -s 1:bu_esp '^\(([^)]*)\)' "$prefix"
regexp -s 1:bu_disk '^([^,]+),' "$bu_esp"
set bu_data="${bu_disk},msdos1"

# Fallback: if the expected partition isn't exFAT, search by filesystem label.
probe -s bu_data_fs -f "($bu_data)"
if [ "$bu_data_fs" != "exfat" ]; then
  search --no-floppy --label BIOSUSB --set=bu_data
fi
probe -s bu_data_uuid -u "($bu_data)"

set bu_res="($bu_esp)/boot/biosusb"
export bu_esp bu_disk bu_data bu_data_uuid bu_res

source "$prefix/biosusb-detect.cfg"

# ---------------------------------------------------------------------------
# Menu
# ---------------------------------------------------------------------------
function bu_add_iso {
  # $1 = path of the ISO relative to the data partition, e.g. /linux/foo.iso
  # menuentry passes its title as $1 and extra args as $2.., hence "$1" twice.
  menuentry "$1" "$1" --class iso {
    bu_boot_iso "$2"
  }
}

set bu_count=0
for bu_f in ($bu_data)/*.iso ($bu_data)/*.ISO ($bu_data)/*/*.iso ($bu_data)/*/*.ISO; do
  if [ -f "$bu_f" ]; then
    regexp -s 1:bu_rel '^\([^)]*\)(.*)$' "$bu_f"
    bu_add_iso "$bu_rel"
    set bu_count=1
  fi
done

if [ "$bu_count" = "0" ]; then
  menuentry "No ISO files found - copy .iso files onto the BIOSUSB partition" {
    echo "Data partition: ($bu_data)"
    ls ($bu_data)/
    bu_pause
  }
fi

menuentry " " { true }
menuentry "Boot from first internal disk" --class disk {
  if [ "$grub_platform" = "efi" ]; then
    echo "Exit to firmware boot menu..."
    exit
  else
    set root=(hd1)
    chainloader +1
    boot
  fi
}
if [ "$grub_platform" = "efi" ]; then
  menuentry "UEFI firmware settings" --class settings { fwsetup }
fi
menuentry "Reboot" --class reboot { reboot }
menuentry "Power off" --class shutdown { halt }
menuentry "About BIOS-USB $biosusb_version ($grub_platform)" {
  echo "BIOS-USB $biosusb_version - GRUB $grub_cpu-$grub_platform"
  echo "ESP:  ($bu_esp)"
  echo "Data: ($bu_data)  uuid=$bu_data_uuid  fs=$bu_data_fs"
  bu_pause
}
