# Glassboot boot menu
#
# Lives on the ESP (partition 2) at /boot/grub/grub.cfg. Scans the exFAT data
# partition (partition 1 of the same disk) for ISO files and builds a menu entry for
# each one. See boot/grub/glassboot-detect.cfg for how each ISO is booted.

set glassboot_version="0.3.0-dev"

insmod part_msdos
insmod fat
insmod exfat
insmod ntfs
insmod iso9660
insmod udf
insmod loopback
insmod regexp
insmod probe
insmod test
insmod echo
insmod sleep
insmod configfile
insmod linux
insmod all_video
insmod procfs
insmod syslinuxcfg
insmod chain
insmod glassboot
if [ "$grub_platform" = "pc" ]; then
  insmod linux16
fi
insmod hashsum
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg
insmod font
insmod password_pbkdf2
if [ "$grub_platform" = "pc" ]; then
  insmod drivemap
fi

set timeout=-1
set default=0

# ---------------------------------------------------------------------------
# Locate our partitions.
#   $prefix looks like (hd0,msdos2)/boot/grub  -> ESP = hd0,msdos2, disk = hd0
# ---------------------------------------------------------------------------
regexp -s 1:gb_esp '^\(([^)]*)\)' "$prefix"
regexp -s 1:gb_disk '^([^,]+),' "$gb_esp"
set gb_data="${gb_disk},msdos1"

# Fallback: if the expected partition isn't exFAT, search by filesystem label.
probe -s gb_data_fs -f "($gb_data)"
if [ "$gb_data_fs" != "exfat" ]; then
  search --no-floppy --label GLASSBOOT --set=gb_data
fi
probe -s gb_data_uuid -u "($gb_data)"
# "<MBR disk signature>-<partition number>": how the initrd hook finds this drive.
probe -s gb_partuuid --part-uuid "($gb_data)"

set gb_res="($gb_esp)/boot/glassboot"
export gb_esp gb_disk gb_data gb_data_uuid gb_partuuid gb_res

source "$prefix/glassboot-detect.cfg"

# ---------------------------------------------------------------------------
# User settings: \glassboot\glassboot.cfg on the GLASSBOOT drive (see gb_config in
# boot/grub-module/glassboot.c and docs/CONFIG.md).
# ---------------------------------------------------------------------------
gb_config "($gb_data)/glassboot/glassboot.cfg"

if [ -n "$gb_cfg_password" ]; then
  set superusers="glassboot"
  password_pbkdf2 glassboot "$gb_cfg_password"
  export superusers
fi

if [ -n "$gb_cfg_theme" -a -f "($gb_data)$gb_cfg_theme" ]; then
  regexp -s 1:gb_theme_dir '^(.*)/[^/]*$' "$gb_cfg_theme"
  for gb_font in ($gb_data)$gb_theme_dir/*.pf2; do
    if [ -f "$gb_font" ]; then loadfont "$gb_font"; fi
  done
  terminal_output gfxterm
  set theme="($gb_data)$gb_cfg_theme"
  export theme
fi

# ---------------------------------------------------------------------------
# Menu: one entry per bootable file anywhere on the data partition (gb_scan in
# boot/grub-module/glassboot.c). Each entry calls gb_entry KIND PATH.
# ---------------------------------------------------------------------------
gb_scan "($gb_data)"

if [ -n "$gb_cfg_timeout" ]; then set timeout="$gb_cfg_timeout"; fi
if [ -n "$gb_default_id" ]; then set default="$gb_default_id"; fi

if [ "$gb_iso_count" = "0" ]; then
  menuentry "Nothing to boot yet - copy .iso (or .wim, .img, .efi) files onto the GLASSBOOT drive" {
    echo "Data partition: ($gb_data)"
    ls ($gb_data)/
    gb_pause
  }
else
  source (proc)/glassboot_menu
fi

menuentry " " { true }
submenu "Boot an installed operating system...    [F4]" --class os --hotkey=f4 {
  gb_scan_os "$gb_disk"
  if [ "$gb_os_count" = "0" ]; then
    menuentry "No other operating system found" { true }
  else
    source (proc)/glassboot_os
  fi
  if [ "$grub_platform" = "efi" ]; then
    menuentry "Exit to the firmware's boot menu" --class settings { exit }
  fi
}

if [ "$gb_iso_count" != "0" ]; then
  submenu "More boot modes (if an ISO doesn't start)...    [F6]" --class settings --hotkey=f6 {
    submenu "Use the ISO's loopback.cfg (distribution finds the ISO file itself)" {
      set gb_mode=loopback
      source (proc)/glassboot_menu
    }
    submenu "Compatibility mode (known distributions, no hook)" {
      set gb_mode=compat
      source (proc)/glassboot_menu
    }
    if [ "$grub_platform" = "efi" ]; then
      submenu "ISO as a virtual CD (start the ISO's own EFI loader; BSDs, other OSes)" {
        set gb_mode=vcd
        source (proc)/glassboot_menu
      }
    else
      submenu "Load the ISO into RAM (memdisk; small ISOs: DOS tools, firmware updaters)" {
        set gb_mode=memdisk
        source (proc)/glassboot_menu
      }
    fi
  }

  submenu "Tools...    [F5]" --class settings --hotkey=f5 {
    submenu "Verify a file's checksum: SHA-256" {
      set gb_mode=checksum ; set gb_hash_algo=sha256
      source (proc)/glassboot_menu
    }
    submenu "Verify a file's checksum: SHA-512" {
      set gb_mode=checksum ; set gb_hash_algo=sha512
      source (proc)/glassboot_menu
    }
    submenu "Verify a file's checksum: SHA-1" {
      set gb_mode=checksum ; set gb_hash_algo=sha1
      source (proc)/glassboot_menu
    }
    submenu "Verify a file's checksum: MD5" {
      set gb_mode=checksum ; set gb_hash_algo=md5
      source (proc)/glassboot_menu
    }
  }
fi

if [ "$grub_platform" = "efi" ]; then
  menuentry "UEFI firmware settings" --class settings { fwsetup }
fi
menuentry "Reboot" --class reboot { reboot }
menuentry "Power off" --class shutdown { halt }
menuentry "About Glassboot $glassboot_version ($grub_platform)" {
  echo "Glassboot $glassboot_version - GRUB $grub_cpu-$grub_platform"
  echo "ESP:  ($gb_esp)"
  echo "Data: ($gb_data)  uuid=$gb_data_uuid  fs=$gb_data_fs  part=$gb_partuuid"
  echo "Bootable files: $gb_iso_count"
  gb_pause
}
