# BIOS-USB: ISO type detection and boot methods.
#
# bu_boot_iso PATH   mounts ($bu_data)PATH as (loop) and tries, in order:
#   1. Windows installer (sources/boot.wim)       -> wimboot + WinPE helper
#   2. ISO ships /boot/grub/loopback.cfg           -> distro's own loop-boot menu
#   3. Known Linux live layouts                    -> kernel args that find the ISO file
#   4. Fallbacks: the ISO's own GRUB menu / EFI chainload
#
# Methods 2-4 rely on the distro's initrd being able to find the ISO by path. A
# universal method (device-mapper mapping of the ISO's sectors) is planned; see
# docs/ARCHITECTURE.md.

function bu_pause {
  echo
  echo "Press Enter to return to the menu."
  read
}

# ---------------------------------------------------------------- Windows
function bu_try_windows {
  if [ ! -f (loop)/sources/boot.wim ]; then return 1; fi
  if [ ! -f "$bu_res/wimboot" ]; then
    echo "This is a Windows ISO, but wimboot is missing from the ESP."
    bu_pause
    return 0
  fi

  # Tell the WinPE helper which ISO to attach (best effort; it falls back to a menu).
  set bu_iso="$iso_path"
  if [ -f "($bu_data)/biosusb/grubenv" ]; then
    save_env -f "($bu_data)/biosusb/grubenv" bu_iso
  fi

  echo "Booting Windows installer via wimboot..."
  if [ "$grub_platform" = "pc" ]; then
    linux16 "$bu_res/wimboot"
    initrd16 \
      newc:winpeshl.ini:$bu_res/win/winpeshl.ini \
      newc:biosusb.cmd:$bu_res/win/biosusb.cmd \
      newc:bcd:(loop)/boot/bcd \
      newc:boot.sdi:(loop)/boot/boot.sdi \
      newc:boot.wim:(loop)/sources/boot.wim
  elif [ "$grub_cpu" = "x86_64" ]; then
    linux "$bu_res/wimboot"
    initrd \
      newc:winpeshl.ini:$bu_res/win/winpeshl.ini \
      newc:biosusb.cmd:$bu_res/win/biosusb.cmd \
      newc:bootx64.efi:(loop)/efi/boot/bootx64.efi \
      newc:bcd:(loop)/efi/microsoft/boot/bcd \
      newc:boot.sdi:(loop)/boot/boot.sdi \
      newc:boot.wim:(loop)/sources/boot.wim
  else
    echo "32-bit UEFI Windows boot is not supported yet."
    bu_pause
    return 0
  fi
  boot
  bu_pause
  return 0
}

# ---------------------------------------------------------------- loopback.cfg
function bu_try_loopback_cfg {
  if [ ! -f (loop)/boot/grub/loopback.cfg ]; then return 1; fi
  echo "Using the ISO's loopback.cfg..."
  set root=(loop)
  configfile /boot/grub/loopback.cfg
  return 0
}

# Boot (loop)$bu_k with initrd(s) $bu_i and cmdline $bu_args.
function bu_boot_linux {
  echo "Kernel: $bu_k"
  echo "Initrd: $bu_i"
  echo "Args:   $bu_args"
  set root=(loop)
  linux $bu_k $bu_args
  initrd $bu_i
  boot
  bu_pause
}

# ---------------------------------------------------------------- Ubuntu family (casper)
function bu_try_casper {
  if [ ! -d (loop)/casper ]; then return 1; fi
  set bu_k="" ; set bu_i=""
  for f in (loop)/casper/vmlinuz*; do
    if [ -z "$bu_k" -a -f "$f" ]; then regexp -s 1:bu_k '^\(loop\)(.*)$' "$f"; fi
  done
  for f in (loop)/casper/initrd*; do
    if [ -z "$bu_i" -a -f "$f" ]; then regexp -s 1:bu_i '^\(loop\)(.*)$' "$f"; fi
  done
  if [ -z "$bu_k" -o -z "$bu_i" ]; then return 1; fi
  set bu_args="boot=casper iso-scan/filename=$iso_path quiet splash ---"
  bu_boot_linux
  return 0
}

# ---------------------------------------------------------------- Debian live (live-boot)
function bu_try_debian_live {
  if [ ! -d (loop)/live ]; then return 1; fi
  set bu_k="" ; set bu_i=""
  for f in (loop)/live/vmlinuz*; do
    if [ -z "$bu_k" -a -f "$f" ]; then regexp -s 1:bu_k '^\(loop\)(.*)$' "$f"; fi
  done
  for f in (loop)/live/initrd*; do
    if [ -z "$bu_i" -a -f "$f" ]; then regexp -s 1:bu_i '^\(loop\)(.*)$' "$f"; fi
  done
  if [ -z "$bu_k" -o -z "$bu_i" ]; then return 1; fi
  set bu_args="boot=live components findiso=$iso_path quiet splash"
  bu_boot_linux
  return 0
}

# ---------------------------------------------------------------- Arch (archiso)
function bu_try_archiso {
  if [ ! -f (loop)/arch/boot/x86_64/vmlinuz-linux ]; then return 1; fi
  set bu_k=/arch/boot/x86_64/vmlinuz-linux
  set bu_i=""
  for f in /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img; do
    if [ -f "(loop)$f" ]; then set bu_i="$bu_i $f"; fi
  done
  set bu_i="$bu_i /arch/boot/x86_64/initramfs-linux.img"
  set bu_args="archisobasedir=arch img_dev=/dev/disk/by-uuid/$bu_data_uuid img_loop=$iso_path earlymodules=loop"
  bu_boot_linux
  return 0
}

# ---------------------------------------------------------------- Fedora / openSUSE (dracut live)
function bu_try_dracut_live {
  set bu_k="" ; set bu_i=""
  if [ -f (loop)/images/pxeboot/vmlinuz ]; then
    set bu_k=/images/pxeboot/vmlinuz ; set bu_i=/images/pxeboot/initrd.img
  elif [ -f (loop)/boot/x86_64/loader/linux ]; then
    set bu_k=/boot/x86_64/loader/linux ; set bu_i=/boot/x86_64/loader/initrd
  else
    return 1
  fi
  probe -s bu_iso_label -l (loop)
  set bu_args="root=live:CDLABEL=$bu_iso_label iso-scan/filename=$iso_path rd.live.image quiet"
  bu_boot_linux
  return 0
}

# ---------------------------------------------------------------- fallbacks
function bu_try_fallback {
  echo "BIOS-USB doesn't recognise this ISO's layout."
  echo
  if [ -f (loop)/boot/grub/grub.cfg ]; then
    echo "Trying the ISO's own GRUB menu (the OS may fail to find its files later)..."
    sleep 3
    set root=(loop)
    configfile /boot/grub/grub.cfg
  elif [ "$grub_platform" = "efi" -a "$grub_cpu" = "x86_64" -a -f (loop)/efi/boot/bootx64.efi ]; then
    echo "Chainloading the ISO's EFI loader (works for self-contained tools)..."
    sleep 3
    chainloader (loop)/efi/boot/bootx64.efi
    boot
  fi
  bu_pause
}

# ---------------------------------------------------------------- entry point
function bu_boot_iso {
  set iso_path="$1"
  export iso_path
  loopback -d loop
  if ! loopback loop "($bu_data)$iso_path"; then
    echo "Could not open $iso_path"
    bu_pause
    return
  fi

  if bu_try_windows; then return; fi
  if bu_try_loopback_cfg; then return; fi
  if bu_try_casper; then return; fi
  if bu_try_debian_live; then return; fi
  if bu_try_archiso; then return; fi
  if bu_try_dracut_live; then return; fi
  bu_try_fallback
}
