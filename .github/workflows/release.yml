name: Build and verify portable releases
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
env:
  SOURCE_DATE_EPOCH: '1704067200'
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build and packaging dependencies
        run: |
          sudo bash scripts/install-deps.sh
          sudo apt-get install -y libtool-bin libfuse3-dev libzstd-dev squashfs-tools patchelf python3-pil
      - name: Build verified boot sources and payload
        run: |
          bash scripts/build.sh all
          bash scripts/build-payload.sh
          bash scripts/check-reproducible-payload.sh
      - name: Build AppImage and run unit tests
        run: bash scripts/package-linux.sh
      - name: Check clean and corrupt boot files, BIOS and UEFI
        run: sudo bash Utility-Source/tests/release-qemu-test.sh /var/tmp/glassboot-release-linux
      - name: Boot pinned Alpine ISO, BIOS and UEFI
        run: sudo bash Utility-Source/tests/release-iso-test.sh /var/tmp/glassboot-release-linux
      - name: Validate PXE tree preparation and HTTP serving
        run: python3 Utility-Source/tests/netboot-test.py
      - name: Boot pinned Alpine ISO on ARM64 UEFI
        run: sudo bash Utility-Source/tests/arm64-qemu-test.sh /var/tmp/glassboot-release-linux
      - name: Smoke-test extracted AppImage
        run: |
          QT_QPA_PLATFORM=offscreen dist/*.AppImage --appimage-extract-and-run --version
          dist/*.AppImage --appimage-extract-and-run --cli --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boot-payload
          path: out/payload/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-portable
          path: |
            dist/*.AppImage
            dist/*.AppImage.*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: boot-validation
          path: out/validation/
  windows:
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: boot-payload
          path: out/payload
      - name: Install pinned Qt SDK
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:Qt -m qttools
      - name: Build portable directory and ZIP
        shell: pwsh
        run: ./scripts/package-windows.ps1 -QtDir C:/Qt/6.8.3/msvc2022_64
      - name: Smoke-test portable CLI
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/Glassboot-*-windows-x86_64/glassboot-cli.exe | Select-Object -First 1
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Portable CLI failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable
          path: |
            dist/*.zip
            dist/*.zip.*.json
  assemble:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-portable'
          merge-multiple: true
          path: dist
      - run: python3 scripts/release.py hashes dist
      # Artifacts only. Publishing and signing require a maintainer's trusted key.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glassboot-release-unsigned
          path: dist/
